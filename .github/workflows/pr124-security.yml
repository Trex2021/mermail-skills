name: PR124 live security stops at immutable product head
on:
  push:
    branches: [evaluation/pr124-security-20261004]
    paths: ['evaluation/pr124-security/security.mjs', 'evaluation/pr124-security/security.test.mjs', 'evaluation/pr124-security/run.mjs', 'evaluation/pr124-security/proxy.mjs', 'evaluation/pr124-security/adapter.mjs', '.github/workflows/pr124-security.yml']
permissions:
  contents: read
  copilot-requests: write
concurrency:
  group: pr124-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    if: github.repository == 'Trex2021/mermail-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Checkout evaluation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - name: Checkout immutable product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5e79ba3d7b35ed70a625db5b82f03f82d3f65a64
          path: product
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check product and independent security evaluator
        env:
          PRODUCT_ROOT: ${{ github.workspace }}/product
        run: |
          test "$(git -C product rev-parse HEAD)" = 5e79ba3d7b35ed70a625db5b82f03f82d3f65a64
          npm --prefix product --offline test
          node --test harness/evaluation/pr124-security/security.test.mjs
      - name: Verify authenticated production catalog and discovery
        env:
          MERMAIL_MCP_TEST_API_KEY: ${{ secrets.MERMAIL_MCP_TEST_API_KEY }}
          MERMAIL_REQUIRE_TEST_API_KEY: '1'
        working-directory: product
        run: npm run validate:remote
      - name: Install pinned client
        run: |
          npm install -g @github/copilot@1.0.89
          copilot --version
      - name: Execute six fresh readonly security sessions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERMAIL_API_KEY: ${{ secrets.MERMAIL_MCP_TEST_API_KEY }}
          PRODUCT_ROOT: ${{ github.workspace }}/product
          PRODUCT_COMMIT: 5e79ba3d7b35ed70a625db5b82f03f82d3f65a64
          HARNESS_ROOT: ${{ github.workspace }}/harness/evaluation/pr124-security
          EVALUATION_ROOT: ${{ runner.temp }}/pr124-security
        run: node harness/evaluation/pr124-security/run.mjs
      - name: Upload privacy-reviewed security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr124-live-security-${{ github.run_id }}
          path: ${{ runner.temp }}/pr124-security/public/
          if-no-files-found: error
          retention-days: 14
