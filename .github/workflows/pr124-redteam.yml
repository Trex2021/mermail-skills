name: PR124 controlled security audit
on:
  push:
    branches: [evaluation/pr124-redteam-20261005]
    paths: ['.github/workflows/pr124-redteam.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Trex2021/mermail-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c4876e43189c41771fcfa89f30d6cab400257654
          path: product
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Run exact product checks
        working-directory: product
        run: |
          set -o pipefail
          npm --offline test 2>&1 | tee ../product-tests.log
      - name: Read-only production MCP compatibility
        working-directory: product
        env:
          MERMAIL_MCP_TEST_API_KEY: ${{ secrets.MERMAIL_MCP_TEST_API_KEY }}
        run: |
          set -o pipefail
          if [[ -n "$MERMAIL_MCP_TEST_API_KEY" ]]; then
            export MERMAIL_REQUIRE_TEST_API_KEY=1
          else
            echo "Authenticated checks unavailable: test credential is not configured." | tee ../production-auth-status.log
          fi
          node tests/validate.mjs --remote 2>&1 | tee ../production-check.log
          if [[ -n "$MERMAIL_MCP_TEST_API_KEY" ]]; then
            MERMAIL_API_KEY="$MERMAIL_MCP_TEST_API_KEY" node skills/mermail-mcp/scripts/check-connection.mjs 2>&1 | tee ../connection-check.log
            MERMAIL_API_KEY="$MERMAIL_MCP_TEST_API_KEY" MERMAIL_MCP_URL='https://console.mermail.app/mcp?profile=agent-inbox' node skills/mermail-mcp/scripts/check-connection.mjs 2>&1 | tee ../inbox-profile-check.log
          fi
      - name: Read public compatibility block metadata
        working-directory: product
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const f=JSON.parse(await readFile('tests/fixtures/funding-gate-base-sepolia.json'));
          const results={recordedAt:new Date().toISOString(),purpose:'Read-only public compatibility metadata; no owner payment approval',rpc:f.source.rpc};
          const rpc=async(url,method,params=[])=>{
            const r=await fetch(url,{method:'POST',redirect:'error',signal:AbortSignal.timeout(15000),headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
            if(!r.ok)throw new Error('RPC HTTP '+r.status);
            const body=await r.json();if(body.error||body.result===undefined)throw new Error('RPC read unavailable');return body.result;
          };
          try{
            results.transaction=await rpc(f.source.rpc,'eth_getTransactionByHash',[f.transaction.hash]);
            results.receipt=await rpc(f.source.rpc,'eth_getTransactionReceipt',[f.transaction.hash]);
            results.block=await rpc(f.source.rpc,'eth_getBlockByNumber',[f.transaction.blockNumber,false]);
          }catch(e){results.error=e.message;}
          for(const [name,url] of [['devnet','https://api.devnet.solana.com'],['mainnet-beta','https://api.mainnet-beta.solana.com'],['testnet','https://api.testnet.solana.com']]){
            try{results[name]=await rpc(url,'getGenesisHash');}catch(e){results[name]={error:e.message};}
          }
          await writeFile('../public-compatibility-metadata.json',JSON.stringify(results,null,2)+'\n');
          JS
      - name: Verify current public Base compatibility without any payment claim
        working-directory: product
        run: |
          set -o pipefail
          node --input-type=module <<'JS' 2>&1 | tee ../public-base-observation.log
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {buildMarginPacket} from './skills/mermail-freelance-margin-guard/scripts/build-margin-packet.mjs';
          import {buildFundingCovenant,observePublicSettlement} from './skills/mermail-freelance-margin-guard/scripts/funding-gate.mjs';
          const f=JSON.parse(await readFile('tests/fixtures/funding-gate-base-sepolia.json'));
          const p=buildMarginPacket(JSON.parse(await readFile('tests/fixtures/freelance-margin-guard.json')));
          const c=buildFundingCovenant(p,{
            optionId:'paid_change_order',price:{amount:'487.5',currency:'USD'},
            settlement:{chain:'base-sepolia',assetSymbol:'TEST',assetId:f.transaction.to,decimals:6,amount:'0.002527',destination:'0x'+f.transaction.input.slice(34,74)},
            conversion:{mode:'owner_fixed',sourceRef:'compatibility-test-only'},
            binding:{mode:'public_transaction'},ownerApprovalRef:'synthetic-fixture-not-actual-approval',
            ownerApprovedAt:'2026-09-23T16:00:00Z',policy:{minimumConfirmations:2}
          });
          const observed=await observePublicSettlement(c,f.transaction.hash,{rpcUrl:f.source.rpc});
          assert.equal(observed.amountAtomic,'2527'); assert.equal(observed.decimals,6);
          assert.equal(observed.destination,c.settlement.destination);assert.equal(observed.receiptStatus,'success');
          console.log('Fresh read-only public Base compatibility passed: canonical inclusion, matching token event, receipt-block decimals.');
          console.log('This historical public sample is not a Mermail payment, owner approval, or financial action.');
          JS
      - name: Preserve public test log, compatibility metadata and source assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr124-controlled-audit-${{ github.run_id }}
          retention-days: 7
          path: |
            product-tests.log
            production-check.log
            production-auth-status.log
            connection-check.log
            inbox-profile-check.log
            public-base-observation.log
            public-compatibility-metadata.json
            product/assets/screenshot-1.png
            product/assets/screenshot-2.png
